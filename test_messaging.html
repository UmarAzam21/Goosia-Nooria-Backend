<!DOCTYPE html>
<html>
<head>
    <title>Admin Messaging Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 3px; }
        button:hover { background: #0056b3; }
        textarea { width: 100%; padding: 10px; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>ADMIN MESSAGING DIAGNOSTIC TEST</h1>
    
    <div class="section">
        <h2>1. Check Backend Connection</h2>
        <button onclick="testBackendHealth()">Test Backend Health</button>
        <div id="healthResult"></div>
    </div>
    
    <div class="section">
        <h2>2. Test Admin Login</h2>
        <button onclick="testAdminLogin()">Test Admin Login</button>
        <div id="loginResult"></div>
        <input type="hidden" id="adminToken" value="">
    </div>
    
    <div class="section">
        <h2>3. Fetch All Messages</h2>
        <button onclick="testFetchMessages()">Fetch Messages</button>
        <div id="messagesResult"></div>
    </div>
    
    <div class="section">
        <h2>4. Send Response to First Message</h2>
        <textarea id="responseText" placeholder="Enter response here..." rows="3"></textarea>
        <button onclick="testSendResponse()">Send Response</button>
        <div id="responseResult"></div>
    </div>

    <script>
        const API_URL = 'http://192.168.1.3:5000/api';
        
        function log(elementId, message, type = 'info') {
            const elem = document.getElementById(elementId);
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue';
            elem.innerHTML += '<p style="color: ' + color + ';">' + message + '</p>';
            console.log(message);
        }
        
        async function testBackendHealth() {
            log('healthResult', 'Testing backend...');
            try {
                const response = await fetch('http://192.168.1.3:5000/api/health');
                const data = await response.json();
                log('healthResult', 'SUCCESS: Backend is running: ' + data.status, 'success');
            } catch (err) {
                log('healthResult', 'ERROR: Backend connection failed: ' + err.message, 'error');
            }
        }
        
        async function testAdminLogin() {
            log('loginResult', 'Logging in as admin...');
            try {
                const response = await fetch(API_URL + '/auth/login/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@masjid.com',
                        password: 'admin123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const token = data.access_token;
                    document.getElementById('adminToken').value = token;
                    log('loginResult', 'SUCCESS: Admin logged in. Token: ' + token.substring(0, 30) + '...', 'success');
                } else {
                    log('loginResult', 'ERROR: Login failed: ' + response.status, 'error');
                }
            } catch (err) {
                log('loginResult', 'ERROR: Login error: ' + err.message, 'error');
            }
        }
        
        async function testFetchMessages() {
            const token = document.getElementById('adminToken').value;
            if (!token) {
                log('messagesResult', 'ERROR: Please login first', 'error');
                return;
            }
            
            log('messagesResult', 'Fetching messages...');
            try {
                const response = await fetch(API_URL + '/messages/admin/all', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (response.ok) {
                    const messages = await response.json();
                    log('messagesResult', 'SUCCESS: Fetched ' + messages.length + ' messages', 'success');
                    messages.forEach(function(msg, i) {
                        log('messagesResult', (i+1) + '. ID: ' + msg.id + ' - From: ' + msg.student_name);
                    });
                } else {
                    log('messagesResult', 'ERROR: Fetch failed: ' + response.status, 'error');
                }
            } catch (err) {
                log('messagesResult', 'ERROR: Fetch error: ' + err.message, 'error');
            }
        }
        
        async function testSendResponse() {
            const token = document.getElementById('adminToken').value;
            const responseText = document.getElementById('responseText').value;
            
            if (!token) {
                log('responseResult', 'ERROR: Please login first', 'error');
                return;
            }
            if (!responseText.trim()) {
                log('responseResult', 'ERROR: Please enter a response', 'error');
                return;
            }
            
            log('responseResult', 'Sending response...');
            
            try {
                // Get first message ID
                const messagesResponse = await fetch(API_URL + '/messages/admin/all', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const messages = await messagesResponse.json();
                
                if (messages.length === 0) {
                    log('responseResult', 'ERROR: No messages to respond to', 'error');
                    return;
                }
                
                const messageId = messages[0].id;
                log('responseResult', 'Responding to message ID: ' + messageId);
                
                // Send response
                const response = await fetch(API_URL + '/messages/admin/' + messageId + '/respond', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ response: responseText })
                });
                
                const responseData = await response.json();
                
                if (response.ok) {
                    log('responseResult', 'SUCCESS: Response sent successfully!', 'success');
                    log('responseResult', JSON.stringify(responseData, null, 2));
                } else {
                    log('responseResult', 'ERROR: Failed: ' + response.status, 'error');
                    log('responseResult', 'Error: ' + JSON.stringify(responseData, null, 2), 'error');
                }
            } catch (err) {
                log('responseResult', 'ERROR: ' + err.message, 'error');
            }
        }
        
        // Auto-test on load
        window.onload = function() {
            testBackendHealth();
        };
    </script>
</body>
</html>
